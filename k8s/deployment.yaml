apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app: nginx-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: nginx-test
        image: nnsbs9/nginx-test:latest
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https

